services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: golden_gai
      POSTGRES_USER: golden_gai
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U golden_gai -d golden_gai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    image: webutan/golden-guide:api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://golden_gai:${DB_PASSWORD}@db:5432/golden_gai
      PORT: 3001
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      TWITTER_BEARER_TOKEN: ${TWITTER_BEARER_TOKEN:-}
      # Link previews / SEO (server/routes/seo.js)
      PUBLIC_URL: ${PUBLIC_URL:-}
      SPA_TEMPLATE_URL: ${SPA_TEMPLATE_URL:-http://web/index.html}
      # Database backup at every API start (i.e. on every update), always
      # before migrations. Files land in ./backups next to this file.
      BACKUP_ON_START: ${BACKUP_ON_START:-required}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - uploads:/app/uploads
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    build: .
    image: webutan/golden-guide:web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  db_data_v2:
  uploads:
