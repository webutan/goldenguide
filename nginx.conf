# Scheme the visitor used, for absolute URLs in the SEO pages (og:url,
# canonical, sitemap). Behind a TLS-terminating proxy or a cloudflared tunnel
# this container is reached over plain http, so $scheme alone would say
# "http". Same trust model as the client address below: an incoming
# X-Forwarded-Proto is believed only when the connecting peer is on a
# private/loopback network. Setting PUBLIC_URL on the api container skips all
# of this and is the reliable option.
geo $realip_remote_addr $ggm_trusted_peer {
    default        0;
    127.0.0.0/8    1;
    10.0.0.0/8     1;
    172.16.0.0/12  1;
    192.168.0.0/16 1;
    ::1/128        1;
    fc00::/7       1;
}

map "$ggm_trusted_peer:$http_x_forwarded_proto" $ggm_forwarded_proto {
    default    $scheme;
    "1:https"  https;
    "1:http"   http;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Real client address. This container normally sits behind another proxy
    # (NAS reverse proxy, cloudflared tunnel) on a private network, so the
    # connecting address is that proxy, not the visitor. Trust X-Forwarded-For
    # only when it comes from a private/loopback peer, and take the right-most
    # address that is not itself a trusted proxy. $remote_addr is then the
    # visitor, which is what the API's rate limits key on.
    set_real_ip_from  127.0.0.0/8;
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    set_real_ip_from  fc00::/7;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # Deny access to hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # SPA: all unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The shell names the current build's hashed assets: always revalidate it,
    # so a browser never keeps an old shell pointing at deleted files.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Offline mode (G03). The service worker script is how a browser learns
    # about a new build, so it must always be revalidated, never long-cached.
    # (It precaches the shell itself from /index.html above.)
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # .webmanifest isn't in nginx's default mime.types
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Link previews / SEO. The API answers these with the same index.html
    # (it fetches /index.html from this server) plus per-page <head> tags:
    # bar-specific ones for /bar/<slug>, absolute default ones for the three
    # entry pages. Short timeouts, and any failure (API down, slow, rate
    # limited, 5xx) falls back to the static shell, so the app always loads.
    # The API's deliberate 404 (unknown bar) is not in the error_page list and
    # passes through with its body.
    location ^~ /bar/ {
        proxy_pass             http://api:3001;
        proxy_http_version     1.1;
        proxy_set_header       Host              $http_host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $remote_addr;
        proxy_set_header       X-Forwarded-Proto $ggm_forwarded_proto;
        proxy_connect_timeout  2s;
        proxy_send_timeout     4s;
        proxy_read_timeout     4s;
        proxy_intercept_errors on;
        error_page 429 500 502 503 504 = @spa_shell;
    }

    # Entry pages: /, /map, /directory (same settings as /bar/ above)
    location ~ ^/(?:map|directory)?$ {
        proxy_pass             http://api:3001;
        proxy_http_version     1.1;
        proxy_set_header       Host              $http_host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $remote_addr;
        proxy_set_header       X-Forwarded-Proto $ggm_forwarded_proto;
        proxy_connect_timeout  2s;
        proxy_send_timeout     4s;
        proxy_read_timeout     4s;
        proxy_intercept_errors on;
        error_page 429 500 502 503 504 = @spa_shell;
    }

    location @spa_shell {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = /sitemap.xml {
        proxy_pass             http://api:3001;
        proxy_http_version     1.1;
        proxy_set_header       Host              $http_host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $remote_addr;
        proxy_set_header       X-Forwarded-Proto $ggm_forwarded_proto;
        proxy_connect_timeout  2s;
        proxy_read_timeout     10s;
    }

    location = /robots.txt {
        proxy_pass             http://api:3001;
        proxy_http_version     1.1;
        proxy_set_header       Host              $http_host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $remote_addr;
        proxy_set_header       X-Forwarded-Proto $ggm_forwarded_proto;
        proxy_connect_timeout  2s;
        proxy_read_timeout     10s;
    }

    # Proxy Socket.io (WebSocket upgrade)
    location /socket.io/ {
        proxy_pass         http://api:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;
    }

    # Proxy API requests to the Express container
    location /api/ {
        proxy_pass         http://api:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 20m;  # allow photo uploads
    }

    # Proxy uploaded photos to the Express container
    location /uploads/ {
        proxy_pass         http://api:3001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        expires            7d;
        add_header         Cache-Control "public";
    }

    # Vite's hashed bundles never change under the same name
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static art: cache for a week
    location /gaichan/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # 3D Gai-chan model — .glb isn't in nginx's default mime.types
    # (regex location wins over /gaichan/, so it repeats the week cache)
    location ~* \.glb$ {
        types { model/gltf-binary glb; }
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml model/gltf-binary;
    gzip_min_length 1024;
}
